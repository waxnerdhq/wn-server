{{define "content"}}
<h1>Sign in</h1>
<p>Sign in with the owner's account name and app password. <code>wn-server password</code> prints the app password on the server.</p>
{{with .Message}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/ui/login" class="stack">
<label>Account name <input name="name" value="{{.Name}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
<label>App password <input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Sign in</button>
</form>
{{end}}
