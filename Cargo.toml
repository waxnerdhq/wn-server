[package]
name = "wn-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "wn_server"
path = "src/lib.rs"

[[bin]]
name = "wn-server"
path = "src/main.rs"

[lints]
workspace = true

# Every dependency of the project is declared here. docs/design.md section 3.2
# lists the role and licence of each one.
[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
futures-util = { version = "0.3", default-features = false }
gethostname = "1"
hex = "0.4"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25"
md-5 = "0.11"
mdns-sd = "0.21"
mime_guess = "2"
quick-xml = "0.42"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
