name: release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Read pinned versions
        run: grep -E '^[A-Z_]+=' bundle/versions.env >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: make check
        run: make check

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          fi

      - name: Build bundle
        run: bundle/build.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: wn-server-${{ env.VERSION }}-linux-amd64
          path: |
            dist/wn-server-${{ env.VERSION }}-linux-amd64.tar.gz
            dist/wn-server-${{ env.VERSION }}-linux-amd64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "dist/wn-server-$VERSION-linux-amd64.tar.gz" \
            "dist/wn-server-$VERSION-linux-amd64.tar.gz.sha256"
