# Checks the workspace. Runs on pull requests only: when a pull request is
# opened, and on every push to its branch.
#
# The pipeline does not run on pushes to main. The merge sequence in AGENTS.md
# rebases a pull request on main, waits for this pipeline on the rebased head
# commit, and squash-merges one pull request at a time. The merge commit on
# main therefore has the tree that this pipeline checked.
#
# What the pipeline verifies for each OS:
#
# - Linux: `cargo xtask check` runs natively in the container. It runs rustfmt,
#   clippy with warnings as errors, and the test suite, each for the whole
#   workspace.
# - Windows: clippy compiles the whole workspace for the
#   x86_64-pc-windows-gnu target. That covers every crate, every test and
#   example, every dependency and every build script. No test runs and no
#   Windows binary is linked. Nothing is compiled for the MSVC target. Tests
#   run on Windows by hand until a Windows agent exists.
# - macOS: nothing. There is no macOS agent. A developer runs
#   `cargo xtask check` on macOS before every push.
when:
  - event: pull_request

steps:
  # One step, because packages installed in one step are gone in the next.
  # The image tag matches the toolchain in rust-toolchain.toml.
  #
  # Nothing is cached between runs. A run is three builds from an empty target
  # directory: clippy for the host, the tests for the host, and clippy for the
  # Windows target. A run takes several minutes on the 2 CPUs that the step
  # requests.
  - name: check
    image: rust:1.98.1-bookworm
    # Cargo settings for the builds of this pipeline. Cargo.toml does not hold
    # them, so a local `cargo xtask check` runs with cargo's defaults.
    environment:
      # The target directory is empty at the start of every run, so nothing
      # reads the data that incremental compilation writes.
      CARGO_INCREMENTAL: "0"
      # The dev profile carries line tables and no other debug information.
      # The test profile inherits the setting. Each file in tests/ is one test
      # binary, and each binary compiles and links faster with less debug
      # information. The panic message of a failing test and the file and line
      # of the failing assertion do not come from debug information, so the
      # test output is the same. A backtrace keeps its file and line numbers.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    commands:
      # The MinGW-w64 C compiler. libsqlite3-sys compiles the bundled SQLite,
      # which is C, for the Windows target. The cc crate runs
      # x86_64-w64-mingw32-gcc for that target, which this package installs, so
      # CC_x86_64_pc_windows_gnu is not set.
      - apt-get update
      - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # Adds rustfmt and clippy, which rust-toolchain.toml names and the image
      # does not have.
      - rustup toolchain install
      # Adds the Rust standard library for the Windows target.
      - rustup target add x86_64-pc-windows-gnu
      # Linux, native. xtask passes --locked and --workspace to cargo.
      - cargo xtask check
      # Windows, cross build. Clippy compiles the workspace without running
      # tests.
      - cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
    backend_options:
      kubernetes:
        # The step sets requests only. Limits come from the namespace.
        resources:
          requests:
            cpu: "2"
            memory: 3Gi
