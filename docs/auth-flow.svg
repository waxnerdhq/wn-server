<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <style>
    .lane { fill:#f3f4f6; stroke:#9ca3af; }
    .lane-nd { fill:#fef3c7; stroke:#d97706; }
    .lane-ws { fill:#dbeafe; stroke:#2563eb; }
    .lane-wc { fill:#dcfce7; stroke:#16a34a; }
    .lt { font-size:15px; font-weight:bold; text-anchor:middle; fill:#111; }
    .ls { font-size:12px; text-anchor:middle; fill:#374151; }
    .life { stroke:#9ca3af; stroke-dasharray:4 4; }
    .msg { stroke:#222; stroke-width:1.4; marker-end:url(#arr); fill:none; }
    .msgb { stroke:#1d4ed8; stroke-width:1.4; marker-end:url(#arrb); fill:none; }
    .lbl { text-anchor:middle; fill:#111; }
    .num { font-weight:bold; fill:#1d4ed8; }
    .h { font-size:18px; font-weight:bold; fill:#111; }
    .note { fill:#fffbeb; stroke:#d97706; }
    .notet { font-size:12px; fill:#111; }
    .self { fill:#eef2ff; stroke:#4f46e5; }
  </style>

  <!-- ===================== Section A ===================== -->
  <text x="40" y="40" class="h">A. One-time owner setup:  wn-server login  (run on the server machine)</text>

  <!-- lane headers -->
  <rect x="70" y="60" width="220" height="56" rx="6" class="lane"/>
  <text x="180" y="83" class="lt">Owner's browser</text>
  <text x="180" y="103" class="ls">on any device</text>

  <rect x="410" y="60" width="220" height="56" rx="6" class="lane-ws"/>
  <text x="520" y="83" class="lt">wn-server</text>
  <text x="520" y="103" class="ls">CLI + reverse proxy + supervisor</text>

  <rect x="750" y="60" width="220" height="56" rx="6" class="lane-wc"/>
  <text x="860" y="83" class="lt">wn-cloud</text>
  <text x="860" y="103" class="ls">GoTrue + waxnerd API (v2)</text>

  <rect x="1090" y="60" width="220" height="56" rx="6" class="lane-nd"/>
  <text x="1200" y="83" class="lt">Navidrome</text>
  <text x="1200" y="103" class="ls">child process, 127.0.0.1 only</text>

  <!-- lifelines -->
  <line x1="180" y1="116" x2="180" y2="560" class="life"/>
  <line x1="520" y1="116" x2="520" y2="560" class="life"/>
  <line x1="860" y1="116" x2="860" y2="560" class="life"/>
  <line x1="1200" y1="116" x2="1200" y2="560" class="life"/>

  <!-- 1 wn-server -> browser -->
  <line x1="520" y1="160" x2="180" y2="160" class="msg"/>
  <text x="350" y="150" class="lbl"><tspan class="num">1</tspan> prints &lt;wn-cloud&gt;/cli/auth with state, PKCE challenge,</text>
  <text x="350" y="176" class="lbl">label and display=code; the owner opens it in a browser</text>

  <!-- 2 browser -> wn-cloud -->
  <line x1="180" y1="215" x2="860" y2="215" class="msg"/>
  <text x="520" y="205" class="lbl"><tspan class="num">2</tspan> owner signs in with their waxnerd account and approves</text>

  <!-- 3 wn-cloud -> browser -->
  <line x1="860" y1="265" x2="180" y2="265" class="msg"/>
  <text x="520" y="255" class="lbl"><tspan class="num">3</tspan> page shows the sign-in code with a copy button</text>

  <!-- 4 browser -> wn-server -->
  <line x1="180" y1="315" x2="520" y2="315" class="msg"/>
  <text x="350" y="305" class="lbl"><tspan class="num">4</tspan> owner pastes the code at the login prompt</text>

  <!-- 5 wn-server -> wn-cloud -->
  <line x1="520" y1="365" x2="860" y2="365" class="msg"/>
  <text x="690" y="355" class="lbl"><tspan class="num">5</tspan> POST /cli/token with code + PKCE verifier → CLI token (wn_…) = server credential</text>

  <!-- 6 wn-server -> wn-cloud -->
  <line x1="520" y1="415" x2="860" y2="415" class="msg"/>
  <text x="690" y="405" class="lbl"><tspan class="num">6</tspan> register this server under the owner → server id</text>

  <!-- 7 wn-server -> navidrome -->
  <line x1="520" y1="465" x2="1200" y2="465" class="msg"/>
  <text x="860" y="443" class="lbl"><tspan class="num">7</tspan> at serve start, after ready: native API POST /api/user</text>
  <text x="860" y="458" class="lbl" font-size="11">creates the owner's Navidrome user with admin set; not created from a header request</text>

  <!-- 8 wn-server -> navidrome -->
  <line x1="520" y1="515" x2="1200" y2="515" class="msg"/>
  <text x="860" y="493" class="lbl"><tspan class="num">8</tspan> optional: POST /api/player  →  Navidrome API key (nds_…)</text>
  <text x="860" y="508" class="lbl" font-size="11">only needed for background jobs; the proxy header already authenticates forwarded requests</text>

  <!-- note -->
  <rect x="70" y="575" width="1240" height="46" rx="6" class="note"/>
  <text x="90" y="594" class="notet">Result: wn-server holds the owner's wn-cloud CLI token as its server credential, and the only Navidrome API key. No browser, phone, or desktop app ever sees a Navidrome key or password.</text>
  <text x="90" y="612" class="notet">Navidrome never listens on the network; every request reaches it through wn-server's proxy on loopback. Navidrome's own web UI is blocked at the proxy.</text>

  <!-- ===================== Section B ===================== -->
  <text x="40" y="680" class="h">B. First-party clients  (wn-mobile, wn-desktop). The web UI and third-party Subsonic clients use the owner's name and app password instead.</text>

  <rect x="70" y="700" width="220" height="56" rx="6" class="lane"/>
  <text x="180" y="723" class="lt">Client app</text>
  <text x="180" y="743" class="ls">the owner</text>

  <rect x="410" y="700" width="220" height="56" rx="6" class="lane-ws"/>
  <text x="520" y="723" class="lt">wn-server</text>
  <text x="520" y="743" class="ls">reverse proxy</text>

  <rect x="750" y="700" width="220" height="56" rx="6" class="lane-wc"/>
  <text x="860" y="723" class="lt">wn-cloud</text>
  <text x="860" y="743" class="ls">GoTrue + waxnerd API (v2)</text>

  <rect x="1090" y="700" width="220" height="56" rx="6" class="lane-nd"/>
  <text x="1200" y="723" class="lt">Navidrome</text>
  <text x="1200" y="743" class="ls">child process, 127.0.0.1 only</text>

  <line x1="180" y1="756" x2="180" y2="1040" class="life"/>
  <line x1="520" y1="756" x2="520" y2="1040" class="life"/>
  <line x1="860" y1="756" x2="860" y2="1040" class="life"/>
  <line x1="1200" y1="756" x2="1200" y2="1040" class="life"/>

  <!-- 1 client -> wn-cloud -->
  <line x1="180" y1="790" x2="860" y2="790" class="msg"/>
  <text x="520" y="780" class="lbl"><tspan class="num">1</tspan> owner, signed in at wn-cloud in a browser, picks this server → device code (10 min, single use)</text>

  <!-- 2 client -> wn-server: session exchange -->
  <line x1="180" y1="830" x2="520" y2="830" class="msgb"/>
  <text x="350" y="820" class="lbl"><tspan class="num">2</tspan> POST /api/v1/session with the device code</text>

  <!-- 3 wn-server -> wn-cloud -->
  <line x1="520" y1="870" x2="860" y2="870" class="msg"/>
  <text x="690" y="848" class="lbl"><tspan class="num">3</tspan> POST /servers/:id/device-codes/verify</text>
  <text x="690" y="863" class="lbl" font-size="11">server credential; code spent → user id; refused unless the owner's</text>

  <!-- 4 wn-server -> client: session -->
  <line x1="520" y1="910" x2="180" y2="910" class="msgb"/>
  <text x="350" y="900" class="lbl"><tspan class="num">4</tspan> wn-server session: long-lived, valid only here</text>

  <!-- 5 client -> wn-server: requests -->
  <line x1="180" y1="950" x2="520" y2="950" class="msgb"/>
  <text x="350" y="940" class="lbl"><tspan class="num">5</tspan> every request: Bearer &lt;session&gt; (checked locally)</text>

  <!-- 6 wn-server -> navidrome -->
  <line x1="520" y1="990" x2="1200" y2="990" class="msgb"/>
  <text x="860" y="980" class="lbl"><tspan class="num">6</tspan> same request on loopback, header Remote-User: &lt;account id&gt;</text>

  <!-- 7 response -->
  <line x1="1200" y1="1030" x2="180" y2="1030" class="msgb" stroke-dasharray="6 4"/>
  <text x="690" y="1020" class="lbl"><tspan class="num">7</tspan> response passes back through wn-server to the client</text>

  <rect x="70" y="1055" width="1240" height="46" rx="6" class="note"/>
  <text x="90" y="1074" class="notet">Sessions keep working when wn-cloud is unreachable, and the owner is never refused. New sessions need wn-cloud to verify the code and fail then; the app password always works.</text>
  <text x="90" y="1092" class="notet">No client holds a wn-cloud token, and nothing from wn-cloud is stored for the device. v1 has one account, the owner; listeners return after waxnerd relay is specified.</text>
</svg>
